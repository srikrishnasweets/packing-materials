<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PACKING MATERIALS</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: radial-gradient(circle at 12% 8%, #dbeafe 0%, #f8fafc 42%);
            color: #0f172a;
        }

        header.appbar {
            padding: 14px 20px;
            background: #1d4ed8;
            color: #ffffff;
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.25);
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }

        .appbar-title {
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
        }

        .filter-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            flex-wrap: nowrap;
        }

        .nav-btn {
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 8px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        .export-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .export-menu {
            position: absolute;
            top: 100%;
            margin-top: 6px;
            right: 0;
            left: auto;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.2);
            min-width: 170px;
            padding: 6px;
            display: none;
            z-index: 1000;
        }

        .export-menu.show {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .export-menu button {
            display: block;
            width: 100%;
            border: none;
            background: #ffffff;
            color: #0f172a;
            text-align: left;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .export-menu button:hover {
            background: #eff6ff;
        }

        .sub-filter {
            min-width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 8px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            font-weight: 600;
            outline: none;
        }

        .sub-filter option {
            color: #0f172a;
            background: #ffffff;
        }

        .page {
            padding: 20px;
        }

        @media (max-width: 900px) {
            header.appbar {
                align-items: stretch;
                flex-direction: column;
                gap: 10px;
            }

            .filter-wrap {
                width: 100%;
            }

            .sub-filter {
                min-width: 0;
                width: 100%;
            }
        }

        .main-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #dbeafe;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(3px);
        }

        .type-cards {
            display: grid;
            grid-template-columns: repeat(9, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .type-card {
            border: 1px solid #dbeafe;
            border-radius: 10px;
            background: #f8fafc;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
        }

        .type-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(30, 58, 138, 0.12);
        }

        .type-card.active {
            background: #dbeafe;
            border-color: #2563eb;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
        }

        .type-card-name {
            font-size: 11px;
            color: #1e3a8a;
            font-weight: 700;
            line-height: 1.3;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .type-card-count {
            margin-top: 6px;
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
        }

        /* CATEGORY (RackType) */
        .rack-type-card {
            margin-bottom: 20px;
        }

        .rack-type-header {
            font-weight: 700;
            font-size: 20px;
            color: #0f172a;
            margin-bottom: 10px;
        }

        /* VARIANT */
        .rack-title-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .rack-title {
            min-width: 130px;
            padding: 10px;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            border: 1px solid #dbeafe;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.08);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .rack-title:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.14);
        }

        .rack-title img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            background: #f1f5f9;
        }

        /* PRODUCTS */
        .products-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-top: 10px;
            padding-bottom: 8px;
            padding-top: 3px;
        }

        .product {
            width: 110px;
            flex-shrink: 0;
            text-align: center;
            transition: transform 0.16s ease;
            cursor: pointer;
        }

        .product:hover {
            transform: translateY(-2px);
        }

        /* IMAGE */
        .image-container {
            position: relative;
        }

        .product img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #dbeafe;
            background: #f8fafc;
        }

        /* 🔴 CLOSING BALANCE BADGE */
        .badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #dc2626;
            color: white;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .sale-badge {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: #16a34a;
            color: white;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .gramage-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: #0ea5e9;
            color: white;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        /* NAME */
        .product-name {
            font-size: 12px;
            margin-top: 5px;
            color: #1f2937;
            font-weight: 600;
        }

        .product-type {
            margin-top: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #1d4ed8;
        }

        .subcategory-section {
            margin-top: 14px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
        }

        .subcategory-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 8px;
            padding: 6px 10px;
            width: fit-content;
        }

        .subcategory-meta {
            margin: 0 0 8px 10px;
            font-size: 12px;
            color: #334155;
            font-weight: 600;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .product-modal {
            width: min(760px, 100%);
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
            padding: 16px;
        }

        .product-modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .product-modal-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
        }

        .product-modal-close {
            border: none;
            background: #e2e8f0;
            color: #0f172a;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .product-modal-body {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 16px;
        }

        .product-modal-image img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
        }

        .product-modal-info {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .info-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 10px;
        }

        .info-label {
            font-size: 11px;
            color: #475569;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 13px;
            color: #0f172a;
            font-weight: 700;
            word-break: break-word;
        }

        @media (max-width: 720px) {
            .product-modal-body {
                grid-template-columns: 1fr;
            }

            .product-modal-image img {
                height: 180px;
            }

            .product-modal-info {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 1200px) {
            .type-cards {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .rack-title-row::-webkit-scrollbar,
        .products-grid::-webkit-scrollbar {
            height: 8px;
        }

        .rack-title-row::-webkit-scrollbar-thumb,
        .products-grid::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header class="appbar">
        <div class="appbar-title">PACKING MATERIALS</div>
        <div class="filter-wrap">
            <label for="subcategoryFilter">Sub Category</label>
            <select id="subcategoryFilter" class="sub-filter">
                <option value="__all__">All</option>
            </select>
            <label for="typeFilter">Type</label>
            <select id="typeFilter" class="sub-filter">
                <option value="__all__">All</option>
            </select>
            <button id="resetFiltersBtn" class="nav-btn" type="button">Reset</button>
            <div class="export-wrap">
                <button id="exportBtn" class="nav-btn" type="button">Export</button>
                <div id="exportMenu" class="export-menu">
                    <button id="exportExcelBtn" type="button">Export as Excel</button>
                    <button id="exportPdfBtn" type="button">Export as PDF</button>
                </div>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="main-card">
            <div id="typeCardsContainer" class="type-cards"></div>
            <div id="container"></div>
        </div>
    </main>

    <div id="productModalOverlay" class="modal-overlay">
        <div class="product-modal">
            <div class="product-modal-top">
                <div id="productModalTitle" class="product-modal-title">Product Details</div>
                <button id="productModalClose" class="product-modal-close" type="button">Close</button>
            </div>
            <div class="product-modal-body">
                <div class="product-modal-image">
                    <img id="productModalImage" src="" alt="Packing Material">
                </div>
                <div id="productModalInfo" class="product-modal-info"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script>

        const API = "https://script.google.com/macros/s/AKfycbzTI1gyN1_nTihFkd-efQmmz_2GSYLILjP8IhNKH1C13RmUmzht5ENDWTjV3JCjoTud/exec";

        let fullData = [];
        let selectedSubCategory = "__all__";
        let selectedType = "__all__";

        // DRIVE IMAGE FIX
        function img(link) {
            if (!link || link === "#N/A") return "";

            const match = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w500`;
            }
            return link;
        }

        // PLACEHOLDER
        function placeholder(name) {
            const text = (name || "No Image").substring(0, 12).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
    <rect width="100%" height="100%" fill="#eef2f7"/>
    <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
    font-size="10" font-family="Inter" fill="#475569">${text}</text></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function safeText(value) {
            if (value === undefined || value === null || value === "") return "-";
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function initModalHandlers() {
            const overlay = document.getElementById("productModalOverlay");
            const closeBtn = document.getElementById("productModalClose");
            if (!overlay || !closeBtn) return;

            closeBtn.addEventListener("click", closeProductModal);
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) closeProductModal();
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && overlay.classList.contains("show")) {
                    closeProductModal();
                }
            });
        }

        function closeProductModal() {
            const overlay = document.getElementById("productModalOverlay");
            if (overlay) overlay.classList.remove("show");
        }

        function openProductModal(product) {
            const overlay = document.getElementById("productModalOverlay");
            const title = document.getElementById("productModalTitle");
            const imageEl = document.getElementById("productModalImage");
            const info = document.getElementById("productModalInfo");
            if (!overlay || !title || !imageEl || !info) return;

            const image = product.Img && product.Img !== "#N/A"
                ? img(product.Img)
                : placeholder(product.Product);

            title.textContent = product.Product || "Product Details";
            imageEl.src = image;
            imageEl.onerror = () => {
                imageEl.onerror = null;
                imageEl.src = placeholder(product.Product);
            };

            const details = [
                { label: "Packing Material", value: product.Product },
                { label: "Product", value: product["SKS Product"] },
                { label: "Code", value: product.Code },
                { label: "Category", value: product.Category },
                { label: "Sub Category", value: product.Sub },
                { label: "Type", value: product.Type },
                { label: "Gramage", value: product.Gramage },
                { label: "Current Stock", value: product["Current Stock"] },
                { label: "Last Month Sale", value: product["Last Month Sale"] }
            ];

            info.innerHTML = details.map(item => `
                <div class="info-item">
                    <div class="info-label">${safeText(item.label)}</div>
                    <div class="info-value">${safeText(item.value)}</div>
                </div>
            `).join("");

            overlay.classList.add("show");
        }

        // LOAD
        async function load() {
            try {
                const res = await fetch(API);
                const data = await res.json();

                fullData = data;
                bindSubCategoryFilter();
                bindTypeFilter();
                render();
            } catch (e) {
                console.error("API Error", e);
            }
        }

        function getUniqueValuesByField(data, fieldName, fallback = "Others") {
            return Array.from(new Set(
                data.map(item => item[fieldName] || fallback)
            )).sort((a, b) => a.localeCompare(b));
        }

        function fillSelect(selectEl, values, selectedValue) {
            selectEl.innerHTML = `<option value="__all__">All</option>` +
                values.map(value => `<option value="${value}">${value}</option>`).join("");

            const nextValue = values.includes(selectedValue) ? selectedValue : "__all__";
            selectEl.value = nextValue;
            return nextValue;
        }

        function bindSubCategoryFilter() {
            const subCategoryFilter = document.getElementById("subcategoryFilter");
            if (!subCategoryFilter) return;

            const subCategoryList = getUniqueValuesByField(fullData, "Sub");
            selectedSubCategory = fillSelect(subCategoryFilter, subCategoryList, selectedSubCategory);
            subCategoryFilter.onchange = (e) => {
                selectedSubCategory = e.target.value;
                render();
            };
        }

        function bindTypeFilter() {
            const typeFilter = document.getElementById("typeFilter");
            if (!typeFilter) return;

            const typeList = getUniqueValuesByField(fullData, "Type");
            selectedType = fillSelect(typeFilter, typeList, selectedType);
            typeFilter.onchange = (e) => {
                selectedType = e.target.value;
                render();
            };
        }

        function getFilteredData() {
            return fullData.filter(item => {
                const sub = item.Sub || "Others";
                const type = item.Type || "Others";
                const matchSubCategory = selectedSubCategory === "__all__" || sub === selectedSubCategory;
                const matchType = selectedType === "__all__" || type === selectedType;
                return matchSubCategory && matchType;
            });
        }

        function getExportRows() {
            return getFilteredData().map(item => {
                const row = { ...item };
                delete row.Img;
                return row;
            });
        }

        function resetFilters() {
            selectedSubCategory = "__all__";
            selectedType = "__all__";
            const subCategoryFilter = document.getElementById("subcategoryFilter");
            const typeFilter = document.getElementById("typeFilter");
            if (subCategoryFilter) subCategoryFilter.value = "__all__";
            if (typeFilter) typeFilter.value = "__all__";
            render();
        }

        function exportAsExcel() {
            const rows = getExportRows();
            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Planogram");
            XLSX.writeFile(wb, "planogram_export.xlsx");
        }

        function exportAsPdf() {
            const rows = getExportRows();
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
            const columns = rows.length ? Object.keys(rows[0]) : ["No Data"];
            const body = rows.length
                ? rows.map(row => columns.map(col => row[col] ?? ""))
                : [["No matching records"]];

            doc.setFontSize(12);
            doc.text("Planogram Export", 40, 32);
            doc.autoTable({
                startY: 42,
                head: [columns],
                body
            });
            doc.save("planogram_export.pdf");
        }

        function initToolbarActions() {
            const resetBtn = document.getElementById("resetFiltersBtn");
            const exportBtn = document.getElementById("exportBtn");
            const exportMenu = document.getElementById("exportMenu");
            const exportExcelBtn = document.getElementById("exportExcelBtn");
            const exportPdfBtn = document.getElementById("exportPdfBtn");

            if (resetBtn) {
                resetBtn.addEventListener("click", resetFilters);
            }

            if (exportBtn && exportMenu) {
                exportBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    exportMenu.classList.toggle("show");
                });

                document.addEventListener("click", (e) => {
                    if (!exportMenu.contains(e.target) && e.target !== exportBtn) {
                        exportMenu.classList.remove("show");
                    }
                });
            }

            if (exportExcelBtn) {
                exportExcelBtn.addEventListener("click", () => {
                    exportAsExcel();
                    if (exportMenu) exportMenu.classList.remove("show");
                });
            }

            if (exportPdfBtn) {
                exportPdfBtn.addEventListener("click", () => {
                    exportAsPdf();
                    if (exportMenu) exportMenu.classList.remove("show");
                });
            }
        }

        function renderTypeCards() {
            const typeCardsContainer = document.getElementById("typeCardsContainer");
            const typeFilter = document.getElementById("typeFilter");
            if (!typeCardsContainer) return;

            const source = fullData.filter(item => {
                const sub = item.Sub || "Others";
                return selectedSubCategory === "__all__" || sub === selectedSubCategory;
            });

            const typeCounts = {};
            source.forEach(item => {
                const type = item.Type || "Others";
                typeCounts[type] = (typeCounts[type] || 0) + 1;
            });

            let topTypes = Object.entries(typeCounts)
                .sort((a, b) => {
                    if (b[1] !== a[1]) return b[1] - a[1];
                    return a[0].localeCompare(b[0]);
                })
                .slice(0, 9);

            if (selectedType !== "__all__" && typeCounts[selectedType] && !topTypes.some(([type]) => type === selectedType)) {
                topTypes = [...topTypes.slice(0, 8), [selectedType, typeCounts[selectedType]]];
            }

            typeCardsContainer.innerHTML = topTypes.map(([type, count]) => `
                <div class="type-card ${selectedType === type ? "active" : ""}" data-type="${safeText(type)}" title="Filter by ${safeText(type)}">
                    <div class="type-card-name">${safeText(type)}</div>
                    <div class="type-card-count">${count}</div>
                </div>
            `).join("");

            typeCardsContainer.querySelectorAll(".type-card").forEach(card => {
                card.addEventListener("click", () => {
                    const clickedType = card.dataset.type || "__all__";
                    selectedType = clickedType;
                    if (typeFilter) typeFilter.value = clickedType;
                    render();
                });
            });
        }

        // MAIN RENDER
        function render() {
            const container = document.getElementById("container");
            container.innerHTML = "";
            renderTypeCards();

            const categories = {};
            const filteredData = getFilteredData();

            // BUILD TREE → Category → Sub → Products
            filteredData.forEach(item => {
                const cat = item.Category || "Others";
                const sub = item.Sub || "Others";

                if (!categories[cat]) categories[cat] = {};

                if (!categories[cat][sub]) categories[cat][sub] = [];

                categories[cat][sub].push(item);
            });

            // RENDER
            const categoryKeys = Object.keys(categories).sort((a, b) => {
                if (selectedSubCategory === "__all__") return a.localeCompare(b);
                const aHas = Object.prototype.hasOwnProperty.call(categories[a], selectedSubCategory);
                const bHas = Object.prototype.hasOwnProperty.call(categories[b], selectedSubCategory);
                if (aHas && !bHas) return -1;
                if (!aHas && bHas) return 1;
                return a.localeCompare(b);
            });

            categoryKeys.forEach(category => {
                const card = document.createElement("div");
                card.className = "rack-type-card";
                card.dataset.category = category;

                const header = document.createElement("div");
                header.className = "rack-type-header";
                header.textContent = category;

                card.appendChild(header);

                const subs = categories[category];

                Object.keys(subs)
                    .sort((a, b) => {
                        if (selectedSubCategory !== "__all__") {
                            if (a === selectedSubCategory && b !== selectedSubCategory) return -1;
                            if (a !== selectedSubCategory && b === selectedSubCategory) return 1;
                        }
                        return a.localeCompare(b);
                    })
                    .forEach(sub => {

                        const section = document.createElement("div");
                        section.className = "subcategory-section";

                        const title = document.createElement("div");
                        title.className = "subcategory-title";
                        title.textContent = sub;

                        section.appendChild(title);

                        const subItems = subs[sub];

                        const grid = document.createElement("div");
                        grid.className = "products-grid";

                        subItems
                            .sort((a, b) => a.Product.localeCompare(b.Product))
                            .forEach(p => {

                                const image = p.Img && p.Img !== "#N/A"
                                    ? img(p.Img)
                                    : placeholder(p.Product);

                                const div = document.createElement("div");
                                div.className = "product";
                                div.title = "Click to view details";
                                div.addEventListener("click", () => openProductModal(p));

                                div.innerHTML = `
                            <div class="image-container">
                                <img src="${image}"
                                onerror="this.onerror=null; this.src='${placeholder(p.Product)}'">
                                <div class="gramage-badge">${p.Gramage || ""}</div>
                                <div class="sale-badge">${p["Last Month Sale"] ?? 0}</div>
                                <div class="badge">${p["Current Stock"] || 0}</div>
                            </div>
                            <div class="product-name">${p.Product}</div>
                            <div class="product-type">${p.Type || "Others"}</div>
                        `;

                                grid.appendChild(div);
                            });

                        section.appendChild(grid);
                        card.appendChild(section);
                    });

                container.appendChild(card);
            });

            if (!Object.keys(categories).length) {
                container.innerHTML = `<div style="padding: 24px; text-align: center; color: #475569; font-weight: 600;">No products found for selected filters.</div>`;
            }
        }

        // INIT
        initModalHandlers();
        initToolbarActions();
        load();
        setInterval(load, 10 * 60 * 1000);

    </script>

</body>

</html>
