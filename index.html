<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PACKING MATERIALS</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: radial-gradient(circle at 12% 8%, #dbeafe 0%, #f8fafc 42%);
            color: #0f172a;
        }

        header.appbar {
            padding: 14px 20px;
            background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 40%, #0ea5e9 100%);
            color: #ffffff;
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.25);
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }

        .appbar-title {
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
        }

        .filter-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .sub-filter {
            min-width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 8px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            font-weight: 600;
            outline: none;
        }

        .sub-filter option {
            color: #0f172a;
            background: #ffffff;
        }

        .page {
            padding: 20px;
        }

        @media (max-width: 900px) {
            header.appbar {
                align-items: stretch;
                flex-direction: column;
                gap: 10px;
            }

            .filter-wrap {
                width: 100%;
            }

            .sub-filter {
                min-width: 0;
                width: 100%;
            }
        }

        .main-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #dbeafe;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(3px);
        }

        /* CATEGORY (RackType) */
        .rack-type-card {
            margin-bottom: 20px;
        }

        .rack-type-header {
            font-weight: 700;
            font-size: 20px;
            color: #0f172a;
            margin-bottom: 10px;
        }

        /* VARIANT */
        .rack-title-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .rack-title {
            min-width: 130px;
            padding: 10px;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            border: 1px solid #dbeafe;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.08);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .rack-title:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.14);
        }

        .rack-title img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            background: #f1f5f9;
        }

        /* PRODUCTS */
        .products-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-top: 10px;
            padding-bottom: 8px;
            padding-top: 3px;
        }

        .product {
            width: 110px;
            flex-shrink: 0;
            text-align: center;
            transition: transform 0.16s ease;
        }

        .product:hover {
            transform: translateY(-2px);
        }

        /* IMAGE */
        .image-container {
            position: relative;
        }

        .product img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #dbeafe;
            background: #f8fafc;
        }

        /* 🔴 CLOSING BALANCE BADGE */
        .badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #dc2626;
            color: white;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .gramage-badge {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: #0ea5e9;
            color: white;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        /* NAME */
        .product-name {
            font-size: 12px;
            margin-top: 5px;
            color: #1f2937;
            font-weight: 600;
        }

        .subcategory-section {
            margin-top: 14px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
        }

        .subcategory-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 8px;
            padding: 6px 10px;
            width: fit-content;
        }

        .rack-title-row::-webkit-scrollbar,
        .products-grid::-webkit-scrollbar {
            height: 8px;
        }

        .rack-title-row::-webkit-scrollbar-thumb,
        .products-grid::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header class="appbar">
        <div class="appbar-title">PACKING MATERIALS</div>
        <div class="filter-wrap">
            <label for="subcategoryFilter">Sub Category</label>
            <select id="subcategoryFilter" class="sub-filter">
                <option value="__all__">All</option>
            </select>
        </div>
    </header>

    <main class="page">
        <div class="main-card">
            <div id="container"></div>
        </div>
    </main>

    <script>

        const API = "https://script.google.com/macros/s/AKfycbzTI1gyN1_nTihFkd-efQmmz_2GSYLILjP8IhNKH1C13RmUmzht5ENDWTjV3JCjoTud/exec";

        let fullData = [];
        let selectedSubCategory = "__all__";

        // DRIVE IMAGE FIX
        function img(link) {
            if (!link || link === "#N/A") return "";

            const match = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w500`;
            }
            return link;
        }

        // PLACEHOLDER
        function placeholder(name) {
            const text = (name || "No Image").substring(0, 12).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
    <rect width="100%" height="100%" fill="#eef2f7"/>
    <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
    font-size="10" font-family="Inter" fill="#475569">${text}</text></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        // LOAD
        async function load() {
            try {
                const res = await fetch(API);
                const data = await res.json();

                fullData = data;
                bindSubCategoryFilter();
                render();
            } catch (e) {
                console.error("API Error", e);
            }
        }

        function getUniqueValuesByField(data, fieldName, fallback = "Others") {
            return Array.from(new Set(
                data.map(item => item[fieldName] || fallback)
            )).sort((a, b) => a.localeCompare(b));
        }

        function fillSelect(selectEl, values, selectedValue) {
            selectEl.innerHTML = `<option value="__all__">All</option>` +
                values.map(value => `<option value="${value}">${value}</option>`).join("");

            const nextValue = values.includes(selectedValue) ? selectedValue : "__all__";
            selectEl.value = nextValue;
            return nextValue;
        }

        function bindSubCategoryFilter() {
            const subCategoryFilter = document.getElementById("subcategoryFilter");
            if (!subCategoryFilter) return;

            const subCategoryList = getUniqueValuesByField(fullData, "Sub");
            selectedSubCategory = fillSelect(subCategoryFilter, subCategoryList, selectedSubCategory);
            subCategoryFilter.onchange = (e) => {
                selectedSubCategory = e.target.value;
                render();
            };
        }

        // MAIN RENDER
        function render() {
            const container = document.getElementById("container");
            container.innerHTML = "";

            const categories = {};

            // BUILD TREE → Category → Sub → Products
            fullData.forEach(item => {
                const cat = item.Category || "Others";
                const sub = item.Sub || "Others";

                if (!categories[cat]) categories[cat] = {};

                if (!categories[cat][sub]) categories[cat][sub] = [];

                categories[cat][sub].push(item);
            });

            // RENDER
            const categoryKeys = Object.keys(categories).sort((a, b) => {
                if (selectedSubCategory === "__all__") return a.localeCompare(b);
                const aHas = Object.prototype.hasOwnProperty.call(categories[a], selectedSubCategory);
                const bHas = Object.prototype.hasOwnProperty.call(categories[b], selectedSubCategory);
                if (aHas && !bHas) return -1;
                if (!aHas && bHas) return 1;
                return a.localeCompare(b);
            });

            categoryKeys.forEach(category => {
                const card = document.createElement("div");
                card.className = "rack-type-card";
                card.dataset.category = category;

                const header = document.createElement("div");
                header.className = "rack-type-header";
                header.textContent = category;

                card.appendChild(header);

                const subs = categories[category];

                Object.keys(subs)
                    .sort((a, b) => {
                        if (selectedSubCategory !== "__all__") {
                            if (a === selectedSubCategory && b !== selectedSubCategory) return -1;
                            if (a !== selectedSubCategory && b === selectedSubCategory) return 1;
                        }
                        return a.localeCompare(b);
                    })
                    .forEach(sub => {

                        const section = document.createElement("div");
                        section.className = "subcategory-section";

                        const title = document.createElement("div");
                        title.className = "subcategory-title";
                        title.textContent = sub;

                        section.appendChild(title);

                        const grid = document.createElement("div");
                        grid.className = "products-grid";

                        subs[sub]
                            .sort((a, b) => a.Product.localeCompare(b.Product))
                            .forEach(p => {

                                const image = p.Img && p.Img !== "#N/A"
                                    ? img(p.Img)
                                    : placeholder(p.Product);

                                const div = document.createElement("div");
                                div.className = "product";

                                div.innerHTML = `
                            <div class="image-container">
                                <img src="${image}"
                                onerror="this.onerror=null; this.src='${placeholder(p.Product)}'">
                                <div class="gramage-badge">${p.Gramage || ""}</div>
                                <div class="badge">${p["Current Stock"] || 0}</div>
                            </div>
                            <div class="product-name">${p.Product}</div>
                        `;

                                grid.appendChild(div);
                            });

                        section.appendChild(grid);
                        card.appendChild(section);
                    });

                container.appendChild(card);
            });

            if (!Object.keys(categories).length) {
                container.innerHTML = `<div style="padding: 24px; text-align: center; color: #475569; font-weight: 600;">No products found for selected sub category.</div>`;
            }
        }

        // INIT
        load();

    </script>

</body>

</html>
